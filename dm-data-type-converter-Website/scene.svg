<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Soda fountain counter scene in three bands">
  <rect x="0" y="0" width="1200" height="640" fill="#f6eeda"/>
