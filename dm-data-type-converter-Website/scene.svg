      <animate attributeName="y" values="574;574;522;522;574" keyTimes="0;0.25;0.55;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <rect x="900" y="540" width="130" height="34" rx="8" fill="#5e3e26"/>
    <rect x="928" y="512" width="74" height="30" fill="#5e3e26"/>
    <rect x="946" y="428" width="38" height="88" rx="10" fill="none" stroke="#f6eeda" stroke-width="6"/>
    <rect x="952" y="478" width="26" height="30" fill="#6e5432"/>
