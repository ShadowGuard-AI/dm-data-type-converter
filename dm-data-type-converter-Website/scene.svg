    <rect x="202" y="478" width="26" height="30" fill="#6e5432"/>
    <rect x="188" y="414" width="54" height="16" fill="#5e3e26"/>
    <line x1="218" y1="408" x2="272" y2="366" stroke="#3e2818" stroke-width="9"/>
    <circle cx="280" cy="360" r="13" fill="#5e3e26"/>
