    <rect x="579" y="472" width="32" height="36" fill="#6e5432"/>
    <rect x="562" y="404" width="66" height="18" fill="#5e3e26"/>
    <polygon points="570,438 516,462 520,476 572,456" fill="#5e3e26"/>
    <g>
