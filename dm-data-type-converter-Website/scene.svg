    <rect x="300" y="30" width="30" height="40" rx="8"/><rect x="880" y="22" width="36" height="48" rx="8"/>
    <rect x="1010" y="28" width="32" height="42" rx="8"/><rect x="130" y="106" width="36" height="44" rx="8"/>
    <rect x="960" y="104" width="34" height="46" rx="8"/>
  </g>
  <g>
    <rect x="592" y="66" width="10" height="120" fill="#3e2818"/>
